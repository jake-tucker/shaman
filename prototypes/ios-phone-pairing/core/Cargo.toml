# Throwaway (#652): the Rust half of the spike that pairs with a real Serving Server from an iPhone.
# Not a workspace member. Versions and features follow the root manifest and the build check's (#645).
[package]
name = "shaman_phone_spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
# `staticlib` is what the app links; `cdylib` is what the binding generator reads on the Mac; `lib` is for the
# command-line driver beside it.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "spike-cli"
path = "src/bin/spike-cli.rs"

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32.2", features = ["tokio"] }

tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3.31"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2.6.1"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower-service = "0.3.3"
x509-parser = "0.18.1"

anyhow = "1.0.99"
blake3 = "1.8.2"
dirs = "6.0.0"
dunce = "1.0.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["preserve_order"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.9.0"

base64 = "0.22.1"
hostname = "0.4.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
shaman-relay-protocol = { path = "../../../crates/shaman-relay-protocol" }

reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
rustls-platform-verifier = "0.7.1"

# The shape of Matrix's and Bitwarden's shipping profiles, and the one #635 and #645 measured with.
[profile.size]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
