# Throwaway (#645): does what a thin Client would link from Shaman build, link and run for iOS?
# Not a workspace member. Versions and features follow the root manifest; `Cargo.lock` is a copy of the root's.
[package]
name = "shaman-ios-build-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
# Each stage adds to the one before, so the linked size of each can be told apart.
net = [
    "dep:futures-util", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:rustls", "dep:subtle",
    "dep:tokio-rustls", "dep:tokio-tungstenite", "dep:tower-service", "dep:x509-parser",
]
protocol = [
    "dep:anyhow", "dep:blake3", "dep:dirs", "dep:dunce", "dep:serde", "dep:serde_json", "dep:uuid", "dep:zeroize",
]
pairing = ["net", "protocol", "dep:base64", "dep:hostname", "dep:rcgen", "dep:shaman-relay-protocol"]
relay-http = ["pairing", "dep:reqwest", "dep:rustls-platform-verifier"]
short-code = ["dep:curve25519-dalek", "dep:spake2"]
# Stand-in servers in the same process, to run the client against in a simulator. Never part of a size figure.
selftest = ["relay-http", "short-code", "hyper/server"]

[dependencies]
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

futures-util = { version = "0.3.31", optional = true }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.11.0", features = ["client", "http1", "http2"], optional = true }
hyper-util = { version = "0.1.20", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"], optional = true }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"], optional = true }
subtle = { version = "2.6.1", optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }
tower-service = { version = "0.3.3", optional = true }
x509-parser = { version = "0.18.1", optional = true }

anyhow = { version = "1.0.99", optional = true }
blake3 = { version = "1.8.2", optional = true }
dirs = { version = "6.0.0", optional = true }
dunce = { version = "1.0.5", optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1.0.143", features = ["preserve_order"], optional = true }
uuid = { version = "1.18.1", features = ["serde", "v4"], optional = true }
zeroize = { version = "1.9.0", optional = true }

base64 = { version = "0.22.1", optional = true }
hostname = { version = "0.4.1", optional = true }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"], optional = true }
shaman-relay-protocol = { path = "../../crates/shaman-relay-protocol", optional = true }

reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }

curve25519-dalek = { version = "4.1.3", default-features = false, optional = true }
spake2 = { version = "0.4.0", optional = true }

# The shape of Matrix's and Bitwarden's shipping profiles, and the one #635 measured the macOS host with.
[profile.size]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
