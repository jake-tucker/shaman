[package]
name = "shaman-protocol"
# Never published; what the wire speaks is numbered by `PROTOCOL_VERSION`.
version = "0.1.0"
edition = "2024"
publish = false

# What every Client shares with the Server: the wire's types, Approvals, Questionnaires and the Session projection.
# It does no I/O, so a thin Client links it on a platform the Server never runs on (iOS).

[features]
# Fixtures, such as `Session::for_tests`, that Shaman's own tests build its types from.
test-support = []
# The JSON Schema of each wire type, which `shaman-pairing-wire` builds the Pairing wire's schema from.
schema = ["dep:schemars"]

[dependencies]
anyhow = "1.0.99"
blake3 = "1.8.2"
# Describes each wire type a Peer may be sent or answered, so the Pairing wire's schema is built from the types
# themselves; only `shaman-pairing-wire` turns it on, so neither the Server nor a thin Client builds it.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std", "uuid1"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["preserve_order"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.9.0"
