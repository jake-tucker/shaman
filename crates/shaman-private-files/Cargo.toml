[package]
name = "shaman-private-files"
# Never published.
version = "0.1.0"
edition = "2024"
publish = false

# Files and directories kept to the current user, and files replaced whole or not at all. Shaman's Server and the
# redeeming side of a Pairing both keep their records through it, so it builds wherever a thin Client runs (iOS).

[dependencies]
anyhow = "1.0.99"
tempfile = "3.21.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
