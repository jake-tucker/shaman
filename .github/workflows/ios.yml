name: iOS

# Builds the iOS app over its core and tests both in the simulator, the app signed ad hoc, and lints the Swift. It runs only where
# the app or its core can have changed; a change to a crate the core shares with the Server is checked for iOS by
# build.yml, and shows here on the next change to the app. ios/AGENTS.md holds the same loop for a Mac.

on:
  pull_request:
    paths:
      - "ios/**"
      - "crates/shaman-thin-client/**"
      - "scripts/build-ios-core.sh"
      - "scripts/ios-simulator.sh"
      - ".github/workflows/ios.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ios-pr-{0}', github.event.pull_request.number) || format('ios-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Build and test
    # The only image with Xcode 27, which the project's format needs.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's default is 27.1.
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Install the toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios
          cache-on-failure: true

      - name: Lint the Swift
        # The hand-written Swift alone; ios/ShamanCore is generated.
        run: |
          swift format lint --strict --recursive \
            ios/Shaman ios/ShamanUI/Package.swift ios/ShamanUI/Sources ios/ShamanUI/Tests ios/ShamanTests ios/ShamanUITests

      - name: Keep everything out of UserDefaults
        run: |
          set -euo pipefail
          if grep -rnE '\b(UserDefaults|AppStorage)\b' ios --include='*.swift'; then
            echo "::error::Nothing goes in UserDefaults: the core keeps what the app keeps, in its own directory."
            exit 1
          fi

      - name: Build the core
        run: scripts/build-ios-core.sh sim

      - name: Make the simulator
        id: simulator
        run: |
          udid=$(scripts/ios-simulator.sh Shaman)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test ShamanUI
        working-directory: ios/ShamanUI
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test -scheme ShamanUI -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath ../build/package -resultBundlePath ../build/results/package.xcresult \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build and test the app
        working-directory: ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          # Signed ad hoc, under no team, as no Apple account is needed for: the Keychain answers an unsigned app with
          # errSecMissingEntitlement, and the app keeps its identity key's blob there.
          xcodebuild test -project Shaman.xcodeproj -scheme Shaman -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/xcode -resultBundlePath build/results/app.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= -quiet

      - name: Check nothing was written to UserDefaults
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          container=$(xcrun simctl get_app_container "$UDID" com.jaketucker.shaman data)
          written=$(find "$container/Library/Preferences" -type f 2> /dev/null || true)
          if [ -n "$written" ]; then
            echo "::error::The app wrote to UserDefaults:"
            echo "$written"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ios-test-results
          path: ios/build/results
          retention-days: 7
          if-no-files-found: ignore
