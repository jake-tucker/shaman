name: iOS

# Builds the iOS app over its core and tests both on each simulator scripts/ios-test.sh holds a row for, the app signed
# ad hoc, builds it as the phone runs it, and lints the Swift: a job each, side by side, so that none waits on another or
# is hidden by its failure. It runs only where the app or its core can have changed; a change to a crate the core shares
# with the Server is checked for iOS by build.yml, and shows here on the next change to the app. ios/AGENTS.md holds
# the same loop for a Mac.

on:
  pull_request:
    paths:
      - "ios/**"
      - "crates/shaman-thin-client/**"
      - "scripts/build-ios-core.sh"
      - "scripts/ios-simulator.sh"
      - "scripts/ios-test.sh"
      - ".github/workflows/ios.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ios-pr-{0}', github.event.pull_request.number) || format('ios-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    # The only image with Xcode 27, which the project's format needs.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's default is 27.1.
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Lint the Swift
        # The hand-written Swift alone; ios/ShamanCore is generated.
        run: |
          swift format lint --strict --recursive \
            ios/Shaman ios/ShamanUI/Package.swift ios/ShamanUI/Sources ios/ShamanUI/Tests ios/ShamanTests ios/ShamanUITests

      - name: Keep everything out of UserDefaults
        run: |
          set -euo pipefail
          if grep -rnE '\b(UserDefaults|AppStorage)\b' ios --include='*.swift'; then
            echo "::error::Nothing goes in UserDefaults: the core keeps what the app keeps, in its own directory."
            exit 1
          fi

  test:
    name: Test on the ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        # Minutes are what the job may take, half as long again as it took on 26 November 2026, as the UI tests go on
        # growing: the Pro's 149, 127 of them its app's 277 tests one after another; the closed Duo's 100, 85 of them
        # its 167; and the Pro Max's ran out at 90, having passed 51 of its 66 in 74.
        include:
          - { simulator: pro, device: iPhone 18 Pro, minutes: 225 }
          - { simulator: duo, device: closed iPhone Duo, minutes: 150 }
          - { simulator: pro-max, device: iPhone 18 Pro Max, minutes: 180 }
    runs-on: xcode-27
    timeout-minutes: ${{ matrix.minutes }}
    env:
      SIMULATOR: ${{ matrix.simulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Install the toolchain
        run: rustup toolchain install

      # Each builds the simulator's core for itself, in some three minutes of nothing cached, as waiting for one job to
      # hand it to the rest would take no less. All three build the same, so the quickest keeps it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios
          cache-on-failure: true
          save-if: ${{ matrix.simulator == 'pro-max' }}

      - name: Build the core
        run: scripts/build-ios-core.sh sim

      - name: Boot the simulator
        # Apart from the tests, so that a device the image lacks, or one that does not boot, is told from a test.
        timeout-minutes: 15
        run: |
          xcrun simctl list runtimes
          scripts/ios-simulator.sh "$SIMULATOR"

      - name: Test
        id: test
        # The simulator's row, run whole whatever fails. On the simulator itself and not on clones of it, which
        # xcodebuild deletes as it ends, and what the app wrote in them, which the next step reads.
        run: scripts/ios-test.sh "$SIMULATOR" --ad-hoc -parallel-testing-enabled NO

      - name: Check nothing was written to UserDefaults
        # Of what the tests wrote, whether or not they passed.
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        env:
          TESTED: ${{ steps.test.outcome }}
        run: |
          set -euo pipefail
          udid=$(scripts/ios-simulator.sh "$SIMULATOR")
          # Only a run on the simulator itself leaves the app there to read.
          if ! container=$(xcrun simctl get_app_container "$udid" com.jaketucker.shaman data); then
            # One that failed may never have built it, and has failed the job already.
            if [ "$TESTED" != success ]; then
              echo "The tests failed with no app installed, so there is nothing to check."
              exit 0
            fi
            echo "::error::The tests left no app on the simulator, so there is nothing to check."
            exit 1
          fi
          preferences=$(mktemp -d)
          cp -R "$container/Library/Preferences/." "$preferences" 2> /dev/null || true
          # UIKit's, not the app's: a split view that has stood its columns side by side keeps their widths there, and
          # offers no way not to. A file holding that key alone holds nothing of the app's.
          own="$preferences/com.jaketucker.shaman.plist"
          if [ -f "$own" ] && plutil -remove 'com\.apple\.UIKit\.UISplitViewController\.Root' "$own" > /dev/null \
            && [ "$(plutil -convert json -o - "$own")" = "{}" ]; then
            rm "$own"
          fi
          written=$(find "$preferences" -type f)
          if [ -n "$written" ]; then
            echo "::error::The app wrote to UserDefaults:"
            while IFS= read -r file; do
              echo "$(basename "$file"):"
              plutil -p "$file" || true
            done <<< "$written"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # A job out of time is cancelled, and so has not failed.
        if: ${{ failure() || cancelled() }}
        with:
          name: ios-test-results-${{ matrix.simulator }}
          path: ios/build/results
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Build for the phone
    runs-on: xcode-27
    # The phone's core is size-optimised with fat LTO, and has never been built on this runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Install the toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios
          cache-on-failure: true

      - name: Build the core for the phone
        run: scripts/build-ios-core.sh device

      - name: Build the app for the phone
        working-directory: ios
        run: |
          # As ios/AGENTS.md builds it for the phone, optimised and without the fake, but unsigned: the optimiser warns
          # of what a debug build does not, and every warning is an error.
          xcodebuild build -project Shaman.xcodeproj -scheme Shaman -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO -quiet

      - name: Check the phone's build holds no fake
        working-directory: ios
        run: |
          set -euo pipefail
          binary=build/device/Build/Products/Release-iphoneos/Shaman.app/Shaman
          if [ ! -f "$binary" ]; then
            echo "::error::The phone's build made no $binary to check."
            exit 1
          fi
          if strings -a "$binary" | grep -E 'FakeCore|--fake'; then
            echo "::error::The fake and every debug-only path stay behind #if DEBUG."
            exit 1
          fi
