name: Probe 781

# A one-off for issue 781: whether notarization accepts an app bundle that carries the released `shaman`, signed by
# itself as `ai.shaman.cli`, under a bundle id of its own, and whether the ticket staples. Nothing here is released.
# This branch holds nothing else, so no other workflow runs on it.

on:
  push:
    branches: [probe/781-nested-shaman-notarization]

permissions:
  contents: read

jobs:
  probe:
    name: Notarize a bundle carrying shaman
    # The runner the release builds its Apple silicon binary on.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, sign, notarize and staple
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: v0.4.2
          ASSET: shaman-v0.4.2-aarch64-apple-darwin
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash probe/run.sh

      - name: Remove the signing keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-api-key.p8"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-781
          path: out/
          retention-days: 7
          if-no-files-found: warn
